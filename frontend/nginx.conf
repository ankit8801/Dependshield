server {
    listen 80;
    server_name _;

    # Serve the Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml+rss
               application/json image/svg+xml;

    # Cache static assets aggressively (they have content-hashed names from Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API requests to the backend service.
    # The Docker network resolves "backend" to the backend container.
    # Change BACKEND_HOST if deploying differently.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow large ZIP uploads (50MB limit on backend)
        client_max_body_size 55m;
    }

    # SPA fallback: all unmatched routes serve index.html
    # This enables React Router's client-side routing to work correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
